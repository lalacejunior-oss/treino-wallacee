<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Treino · Wallace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF0EE; --card:#FFFFFF; --ink:#1B2126; --mute:#5F6A72; --line:#D8DDDA;
  --rubber:#20262B; --rubber-ink:#F3F5F4; --plate:#F2B705; --plate-ink:#1B2126;
  --vid:#2F5BD3; --vid-ink:#FFFFFF; --ok:#1F8A55; --soft:#E3E8E5; --warn:#B8432F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#14191D; --card:#1E252A; --ink:#ECEFED; --mute:#9AA6AE; --line:#2E373D;
    --rubber:#0E1215; --rubber-ink:#ECEFED; --plate:#F2B705; --plate-ink:#14191D;
    --vid:#6F93F0; --vid-ink:#0E1215; --ok:#4CC889; --soft:#273036; --warn:#E07A63;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#14191D; --card:#1E252A; --ink:#ECEFED; --mute:#9AA6AE; --line:#2E373D;
  --rubber:#0E1215; --rubber-ink:#ECEFED; --plate:#F2B705; --plate-ink:#14191D;
  --vid:#6F93F0; --vid-ink:#0E1215; --ok:#4CC889; --soft:#273036; --warn:#E07A63;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rubber)}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--vid);outline-offset:2px}

/* topo */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--rubber);color:var(--rubber-ink)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto;padding:10px 16px}
.brand{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:.2px;opacity:.85}
.week{display:flex;align-items:center;gap:4px}
.week button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--rubber-ink);font-size:20px;line-height:1}
.week button:disabled{opacity:.25}
.plate{min-width:96px;padding:0 12px;height:34px;border-radius:17px;background:var(--plate);color:var(--plate-ink);display:flex;align-items:center;justify-content:center;gap:5px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px}
.plate b{font-size:22px;font-weight:800}

/* navegação de dias embaixo */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--rubber);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:48px;min-height:48px;border:0;border-radius:12px;background:transparent;color:rgba(255,255,255,.55);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;position:relative}
.tab[aria-selected="true"]{background:var(--plate);color:var(--plate-ink)}
.tab .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tab[aria-selected="true"] .dot{background:var(--plate-ink)}

main{max-width:640px;margin:0 auto;padding:22px 14px calc(150px + env(safe-area-inset-bottom,0px))}
.dayhead h2{font-size:52px;font-weight:800;line-height:.9;margin:0;letter-spacing:-.5px}
.dayhead p{margin:8px 0 0;color:var(--mute);font-size:17px}
.phase{margin:14px 0 6px;font-size:15px;color:var(--mute)}
.phase strong{color:var(--ink);font-weight:600}
.phase span{display:block}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:16px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .35s}
.barlbl{font-size:14px;color:var(--mute)}

/* exercício */
.ex{background:var(--card);border-radius:20px;margin:14px 0;padding:16px 16px 14px;border:2px solid transparent;transition:border-color .25s}
.ex.done{border-color:var(--ok)}
.exhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.exname{font-size:26px;font-weight:700;line-height:1.02;margin:0}
.exname small{display:block;font-family:"Barlow",sans-serif;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
.vbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--vid);color:var(--vid-ink);display:flex;align-items:center;justify-content:center;flex:none}
.vbtn svg{width:22px;height:22px}
.ex.play .vbtn{background:var(--ink);color:var(--card)}
.spec{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.spec div{padding:8px 4px;text-align:left}
.spec div+div{padding-left:10px;border-left:1px solid var(--line)}
.spec b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;line-height:1.05}
.spec span{font-size:12px;color:var(--mute);font-weight:600}

.sets{display:flex;align-items:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.disc{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;color:var(--mute);position:relative;transition:background .2s,border-color .2s,transform .12s}
.disc span{position:relative;z-index:1}
.disc:active{transform:scale(.94)}
.disc.on{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.disc.on{box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.sethint{font-size:13px;color:var(--mute);flex-basis:100%}

.kgrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.kgrow label{font-weight:600;font-size:15px}
.field{position:relative;width:120px}
.field input{width:100%;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 22px "Barlow Condensed",sans-serif;padding:0 36px 0 12px}
.field input:focus{border-color:var(--ink);outline:none}
.field span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--mute);pointer-events:none}
.prevkg{font-size:14px;color:var(--mute)}
.donebtn{display:block;width:100%;min-height:52px;margin-top:14px;border:0;border-radius:14px;background:var(--ink);color:var(--card);font-weight:700;font-size:17px}
.ex.done .donebtn{background:var(--ok);color:#fff}
.more{margin-top:10px;border:0;background:none;padding:6px 0;font-weight:600;color:var(--vid);font-size:15px}
.details{display:none;padding:6px 0 2px;font-size:15px}
.ex.open .details{display:block}
.details dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.details dt{color:var(--mute)}
.details dd{margin:0}

.player{display:none;margin:14px -16px 0;background:#000;overflow:hidden}
.ex.play .player{display:block}
.player iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.pbar{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;background:var(--soft)}
.pbar button,.pbar a.ytl{border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;text-decoration:none}
.pcue{padding:0 16px 12px;background:var(--soft);font-size:15px}
.pmsg{padding:0 16px 10px;background:var(--soft);font-size:14px;color:var(--warn)}

/* cardio e guia */
.cardio{background:var(--rubber);color:var(--rubber-ink);border-radius:20px;padding:18px;margin:22px 0}
.cardio h3{margin:0 0 4px;font-size:26px}
.cardio p{margin:0 0 12px;opacity:.75;font-size:15px}
.cardio label{display:flex;gap:10px;align-items:center;font-weight:600;min-height:44px}
.cardio input[type=checkbox]{width:26px;height:26px;accent-color:var(--plate)}
.guide section{background:var(--card);border-radius:20px;padding:16px 18px;margin:14px 0}
.guide h3{margin:0 0 6px;font-size:24px}
.guide ul{margin:0;padding-left:20px}
.guide li{margin:5px 0}
.guide .warn h3{color:var(--warn)}
.reset{margin-top:10px;background:transparent;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;color:var(--mute)}

/* cronômetro */
.timer{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--plate);color:var(--plate-ink);border-radius:18px;padding:10px 12px 10px 18px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:20;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.timer.on{display:flex}
.timer b{font-family:"Barlow Condensed",sans-serif;font-size:42px;font-weight:800;line-height:1}
.timer small{display:block;font-size:13px;font-weight:600}
.timer button{border:0;background:var(--plate-ink);color:var(--plate);border-radius:12px;padding:12px 16px;font-weight:700}
.timer.end{background:var(--ok);color:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="toprow">
    <h1 class="brand">Treino Wallace</h1>
    <div class="week" aria-label="Semana do plano">
      <button id="wPrev" aria-label="Semana anterior">−</button>
      <div class="plate">Semana <b id="wNum">1</b></div>
      <button id="wNext" aria-label="Próxima semana">+</button>
    </div>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Dias da semana"></nav>
<main id="main"></main>
<div class="timer" id="timer" role="status" aria-live="polite">
  <div><small id="tLbl">Descanso</small><b id="tTime">0:00</b></div>
  <button id="tStop">Pular</button>
</div>

<script>
const ANIM = (() => {
const L = {to:46, nk:4, hd:9, ua:26, fa:24, th:36, sh:34, ft:11};
const R = Math.PI/180;
const dv = (a,l) => [Math.sin(a*R)*l, -Math.cos(a*R)*l];
const add = (p,v) => [p[0]+v[0], p[1]+v[1]];
const sub = (p,v) => [p[0]-v[0], p[1]-v[1]];
const f = n => n.toFixed(1);
const ln = (a,b,w,c,o) => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c||'var(--fig)'}" stroke-width="${w||7}" stroke-linecap="round"${o?` opacity="${o}"`:''}/>`;
const circ = (p,r,c,o) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" fill="${c||'var(--fig)'}"${o?` opacity="${o}"`:''}/>`;
const EQ = 'var(--eq)', ACC = 'var(--acc)';

function side(p){
  let hip, knee, ank, toe;
  if(p.root==='foot'){ ank=p.at; knee=sub(ank,dv(p.sh,L.sh)); hip=sub(knee,dv(p.th,L.th)); }
  else if(p.root==='toe'){ toe=p.at; ank=sub(toe,dv(p.ft,L.ft)); knee=sub(ank,dv(p.sh,L.sh)); hip=sub(knee,dv(p.th,L.th)); }
  else if(p.root==='knee'){ knee=p.at; hip=sub(knee,dv(p.th,L.th)); ank=add(knee,dv(p.sh,L.sh)); }
  else { hip=p.at; knee=add(hip,dv(p.th,L.th)); ank=add(knee,dv(p.sh,L.sh)); }
  toe = toe || add(ank,dv(p.ft??90,L.ft));
  const sho=add(hip,dv(p.to,L.to)), neck=add(sho,dv(p.to,L.nk)), head=add(neck,dv(p.to,L.hd));
  const ua = p.rel ? p.to+p.ua : p.ua, fa = p.rel ? p.to+p.fa : p.fa;
  const elb=add(sho,dv(ua,L.ua)), hand=add(elb,dv(fa,L.fa));
  return {hip,knee,ank,toe,sho,head,elb,hand};
}
function drawSide(p, P){
  const j = side(p); let s='';
  const pr = P.props||[];
  // far limbs
  s += ln(j.hip,j.knee,7,0,.35)+ln(j.knee,j.ank,7,0,.35);
  if(P.far){ const e2=add(j.sho,dv(P.far[0],L.ua)), h2=add(e2,dv(P.far[1],L.fa)); s += ln(j.sho,e2,6,0,.45)+ln(e2,h2,6,0,.45); } else s += ln(j.sho,j.elb,6,0,.35)+ln(j.elb,j.hand,6,0,.35);
  pr.forEach(q=>{
    if(q.t==='cable') s+=ln(q.a,j.hand,1.6,EQ);
    if(q.t==='cableK') s+=ln(q.a,j.hand,1.6,EQ);
    if(q.t==='plat'){ const c=add(j.toe,dv(q.a,-4)); s+=ln(add(c,dv(q.a,22)),add(c,dv(q.a,-22)),5,EQ); }
    if(q.t==='padAnk') s+=circ(add(j.ank,q.o||[0,0]),6,EQ);
    if(q.t==='padKnee') s+=circ(add(j.knee,q.o||[0,-10]),6,EQ);
    if(q.t==='padHip') s+=circ(add(j.hip,q.o||[0,0]),7,EQ);
    if(q.t==='block') s+=`<rect x="${f(j.toe[0]-14)}" y="${f(j.toe[1]+3)}" width="20" height="8" rx="2" fill="${EQ}"/>`;
  });
  s += ln(j.hip,j.sho,9);
  s += ln(j.sho,j.head,5)+circ(j.head,L.hd);
  s += ln(j.hip,j.knee)+ln(j.knee,j.ank)+ln(j.ank,j.toe,5);
  s += ln(j.sho,j.elb,6)+ln(j.elb,j.hand,6);
  pr.forEach(q=>{
    if(q.t==='db') s+=`<rect x="${f(j.hand[0]-9)}" y="${f(j.hand[1]-5)}" width="18" height="10" rx="3" fill="${ACC}"/>`;
    if(q.t==='bar') s+=circ(j.hand,10,ACC)+circ(j.hand,3,'var(--bg2)');
    if(q.t==='handle') s+=circ(j.hand,4.5,ACC);
  });
  return s;
}
function drawFront(p,P){
  const hip=[100,112], sho=[100,66], hd=[100,46]; let s='';
  const legs = P.seated ? [[10,124,14,158],[]] : [[9,136,11,160]];
  const lg = P.seated ? [[10,0],[14,12],[14,46]] : [[9,0],[10,24],[11,48]];
  [1,-1].forEach(k=>{ const a=[100+k*lg[0][0],112], b=[100+k*lg[1][0],112+lg[1][1]], c=[100+k*lg[2][0],112+lg[2][1]]; s+=ln(a,b)+ln(b,c); });
  if(P.seated) s+=`<rect x="70" y="${118}" width="60" height="7" rx="3" fill="${EQ}"/>`;
  s += ln(hip,sho,12)+ln([84,66],[116,66],8)+circ(hd,10);
  const arms=[];
  [1,-1].forEach(k=>{
    const ua = k===1 ? p.ua : (p.ual??p.ua), fa = k===1 ? p.fa : (p.fal??p.fa);
    const sh=[100+k*16,66], e=[sh[0]+k*Math.sin(ua*R)*L.ua, sh[1]-Math.cos(ua*R)*L.ua], h=[e[0]+k*Math.sin(fa*R)*L.fa, e[1]-Math.cos(fa*R)*L.fa];
    arms.push(h); s+=ln(sh,e,6)+ln(e,h,6);
  });
  const pr=P.props||[];
  pr.forEach(q=>{
    if(q.t==='db') arms.forEach(h=>s+=`<rect x="${f(h[0]-5)}" y="${f(h[1]-9)}" width="10" height="18" rx="3" fill="${ACC}"/>`);
    if(q.t==='handle') arms.forEach(h=>s+=circ(h,4.5,ACC));
    if(q.t==='bar'){ s+=ln(add(arms[1],[-8,0]),add(arms[0],[8,0]),5,ACC); s+=ln([100,2],[(arms[0][0]+arms[1][0])/2,arms[0][1]],1.6,EQ); }
    if(q.t==='cableR'){ s=ln(q.a,arms[0],1.6,EQ)+s; s+=circ(arms[0],4.5,ACC); }
  });
  return s;
}
function drawTop(p,P){
  let s=''; const c=[100,96];
  if(P.legs){
    [1,-1].forEach(k=>{ const h=[100+k*12,104], kn=add(h,[k*Math.sin(p.a*R)*50,-Math.cos(p.a*R)*50]); s+=ln(h,kn,10)+circ(kn,7,EQ); });
    s+=`<rect x="78" y="96" width="44" height="18" rx="8" fill="var(--fig)"/><ellipse cx="100" cy="128" rx="30" ry="12" fill="var(--fig)"/><rect x="92" y="108" width="16" height="16" fill="var(--fig)"/><circle cx="100" cy="127" r="9" fill="var(--bg2)" stroke="var(--fig)" stroke-width="3"/>`;
    s+=`<path d="M70 150 Q100 162 130 150" stroke="${EQ}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    return s;
  }
  s+=`<path d="M60 118 Q100 134 140 118" stroke="${EQ}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  [1,-1].forEach(k=>{ const sh=[100+k*24,c[1]], h=add(sh,[k*Math.cos(p.a*R)*52,-Math.sin(p.a*R)*52]); s+=ln(sh,h,7)+`<rect x="${f(h[0]-5)}" y="${f(h[1]-9)}" width="10" height="18" rx="3" fill="${ACC}"/>`; });
  s+=`<ellipse cx="100" cy="${c[1]}" rx="30" ry="13" fill="var(--fig)"/>`+circ([100,c[1]-2],10,'var(--fig)')+circ([100,c[1]-14],5,'var(--fig)');
  return s;
}
const lerp=(a,b,t)=>{ if(Array.isArray(a)) return a.map((v,i)=>lerp(v,b[i],t)); if(typeof a==='number') return a+(b-a)*t; return a; };
function pose(P,t){ const o={}; for(const k in P.A) o[k]=lerp(P.A[k],P.B[k],t); return o; }

const S = (o)=>Object.assign({view:'side'},o);
const P = {
 inclineDb: S({static:[[104,126,50,98,6],[100,126,128,126,6],[100,126,100,160,4]], A:{at:[100,118],to:-62,th:95,sh:175,ft:90,ua:205,fa:15}, B:{at:[100,118],to:-62,th:95,sh:175,ft:90,ua:15,fa:10}, props:[{t:'db'}]}),
 inclineBar: S({static:[[104,126,50,98,6],[100,126,128,126,6],[100,126,100,160,4],[62,8,62,160,2],[80,8,80,160,2]], A:{at:[100,118],to:-62,th:95,sh:175,ft:90,ua:205,fa:15}, B:{at:[100,118],to:-62,th:95,sh:175,ft:90,ua:15,fa:10}, props:[{t:'bar'}]}),
 chestPress: S({static:[[58,126,104,126,6],[70,128,64,68,6],[80,126,80,160,4]], A:{at:[80,118],to:-8,th:90,sh:180,ft:90,ua:250,fa:85}, B:{at:[80,118],to:-8,th:90,sh:180,ft:90,ua:85,fa:88}, props:[{t:'handle'}]}),
 pulldownWide: {view:'front',seated:true, A:{ua:18,fa:18}, B:{ua:128,fa:22}, props:[{t:'bar'}]},
 pulldownClose: S({static:[[72,126,118,126,6],[95,126,95,160,4]], A:{at:[95,120],to:-10,th:90,sh:180,ft:90,ua:8,fa:3}, B:{at:[95,120],to:-14,th:90,sh:180,ft:90,ua:190,fa:20}, props:[{t:'cable',a:[92,2]},{t:'handle'},{t:'padKnee'}]}),
 seatedRow: S({static:[[36,126,122,126,6],[148,100,148,132,5],[70,126,70,160,4]], A:{at:[70,120],to:8,th:80,sh:100,ft:10,ua:100,fa:95}, B:{at:[70,120],to:-4,th:80,sh:100,ft:10,ua:235,fa:90}, props:[{t:'cable',a:[166,114]},{t:'handle'}]}),
 dbRow: S({static:[[110,126,172,126,6],[118,126,118,160,4],[164,126,164,160,4]], A:{root:'foot',at:[60,160],to:78,th:170,sh:180,ft:90,ua:-180,fa:180}, B:{root:'foot',at:[60,160],to:78,th:170,sh:180,ft:90,ua:-80,fa:180}, far:[150,165], props:[{t:'db'}]}),
 pushdown: S({A:{root:'foot',at:[92,160],to:8,th:180,sh:180,ft:90,ua:182,fa:40}, B:{root:'foot',at:[92,160],to:8,th:180,sh:180,ft:90,ua:182,fa:176}, props:[{t:'cable',a:[132,2]},{t:'handle'}]}),

  if(D.view==='front') s+=drawFront(p,D); else if(D.view==='top') s+=drawTop(p,D); else s+=drawSide(p,D);
  return s;
}

function phaseT(ms){ const c=3800, x=ms%c; const e=v=>.5-.5*Math.cos(Math.PI*v);

return {frame, phaseT, names:Object.keys(P), view:n=>P[n]&&P[n].view};

    <li>Carga ou reps caindo em duas sessões seguidas.</li>
    <li>Dor muscular por mais de 72 h, ou dor articular persistente.</li>
    <li>Sono pior, irritabilidade, falta de vontade.</li>
    <li>FC de repouso 5–7 bpm acima do normal por vários dias.</li>
    <li>Dois ou mais por uma semana: antecipe a semana de recuperação.</li></ul></section>
  <section class="warn"><h3 class="cond">Pare na hora</h3><ul>
    <li>Dor aguda, pontada ou estalo com dor: pare o exercício.</li>
    <li>Tontura, dor no peito ou falta de ar desproporcional: pare o treino e procure atendimento.</li></ul></section>
  <section><h3 class="cond">Cardio</h3><ul>
    <li>Seg, qua e sex depois do treino: esteira inclinada 5,0–6,0 km/h, 4–10%, bike ou elíptico, 25–30 min.</li>
    <li>Moderado: dá para falar frases curtas, não cantar. ~115–135 bpm.</li>
    <li>Pernas cansadas? Troque a esteira de sexta pela bike.</li></ul></section>
  <button class="reset" id="reset">Apagar todos os registros</button>
  </div>`;
}

function render(){
  renderTabs();
  const d = DAYS.find(x=>x.id===day), ph = phase(week);
  $('#wNum').textContent = week;
  $('#wPrev').disabled = week<=1; $('#wNext').disabled = week>=12;
  let html = `<div class="dayhead"><h2 class="cond">${d.title}</h2><p>${d.sub}</p></div>`;
  if(d.guide){ $('#main').innerHTML = html + renderGuide(); return; }
  html += `<div class="phase"><strong>Semana ${week}: ${ph.n}</strong><span>${ph.t}</span></div>`;
  if(d.walk){
    const ok = store.get('walk:'+week);
    html += `<div class="cardio"><h3 class="cond">Caminhada 40–60 min</h3><p>Ao ar livre, leve a moderada. Some aos passos do dia: a meta vai subindo ~1.000 por semana até 7.000–9.000.</p>
      <label><input type="checkbox" id="walk" ${ok?'checked':''}> Caminhada feita</label></div>`;
    $('#main').innerHTML = html; return;
  }
  html += `<div class="bar"><i id="prog"></i></div><div class="barlbl" id="progLbl"></div>`;
  html += d.ex.map(exCard).join('');
  if(d.cardio){
    const ok = store.get('cardio:'+week+':'+d.id);
    html += `<div class="cardio"><h3 class="cond">Cardio depois do treino</h3><p>Esteira inclinada (5,0–6,0 km/h, 4–10%), bike ou elíptico. 25–30 min, moderado.</p>
      <label><input type="checkbox" id="cardio" ${ok?'checked':''}> Cardio feito</label></div>`;
  } else {
    html += `<div class="cardio"><h3 class="cond">Sem cardio hoje</h3><p>Dia de perna: só os passos do dia a dia.</p></div>`;
  }
  $('#main').innerHTML = html;
  updateProg();
}
function updateProg(){
  const d = DAYS.find(x=>x.id===day); if(!d.ex.length || !$('#prog')) return;
  const done = d.ex.filter(e=>(store.get(key(week,e.id))||{}).done).length;
  $('#prog').style.width = (done/d.ex.length*100)+'%';
  $('#progLbl').textContent = `${done} de ${d.ex.length} exercícios feitos`;
}
function save(id,fn){ const k=key(week,id); const l=store.get(k)||{sets:[],rir:'',done:false}; fn(l); store.set(k,l); }

document.addEventListener('click',ev=>{
  const t = ev.target.closest('button'); if(!t) return;
  if(t.dataset.set){ const id=t.dataset.set, k=+t.dataset.k, e=findEx(id), n=setsFor(e,week); let got;
    save(id,l=>{ const cur=Math.min(n,l.n||(l.done?n:0)); l.n = (k<cur) ? k : k+1; l.done = l.n>=n; got=l.n; });
    const c=document.getElementById(id); c.querySelectorAll('.disc').forEach((d,j)=>{ d.classList.toggle('on',j<got); d.setAttribute('aria-label',`Série ${j+1} ${j<got?'feita':'a fazer'}`); });
    c.classList.toggle('done',got>=n); c.querySelector('.sethint').textContent = got>=n?'Exercício concluído':'Toque na anilha ao terminar cada série. O descanso começa sozinho.';
    c.querySelector('.donebtn').textContent = got>=n?'Concluído ✓':'Marcar como concluído';
    updateProg(); renderTabs();
    if(got>k && got<n) startTimer(e.rs, e.n); else if(got>=n){ stopTimer(); const nx=c.nextElementSibling; if(nx&&nx.classList.contains('ex')) setTimeout(()=>nx.scrollIntoView({behavior:'smooth',block:'start'}),350); }
    return; }
  if(t.dataset.play){ const id=t.dataset.play, c=document.getElementById(id), on=c.classList.toggle('play'); t.setAttribute('aria-expanded',on);  if(on) buildPlayer(id); else { playing.delete(id); document.getElementById('pl-'+id).innerHTML=''; } return; }
  if(t.dataset.speed){ speed[t.dataset.speed]=!speed[t.dataset.speed]; t.textContent=speed[t.dataset.speed]?'Velocidade normal':'Câmera lenta'; return; }
  if(t.dataset.yt){ const id=t.dataset.yt; const u=prompt('Cole o link do vídeo do YouTube para este exercício:'); if(u===null) return; const v=ytId(u); if(!v){ buildPlayer(id,'Não reconheci esse link. No YouTube, toque em Compartilhar › Copiar link e cole de novo.'); return; } store.set('yt:'+id,v); delete animPref[id]; buildPlayer(id); return; }
  if(t.dataset.ytdel){ const id=t.dataset.ytdel; if(!confirm('Voltar ao vídeo padrão deste exercício?')) return; try{ localStorage.removeItem('tw:yt:'+id) }catch(e){} buildPlayer(id); return; }
  if(t.dataset.anim){ animPref[t.dataset.anim]=!animPref[t.dataset.anim]; buildPlayer(t.dataset.anim); return; }
  if(t.dataset.day){ day=t.dataset.day; history.replaceState(null,'','#'+day); render(); window.scrollTo(0,0); return; }
  if(t.id==='wPrev'||t.id==='wNext'){ week=Math.min(12,Math.max(1,week+(t.id==='wNext'?1:-1))); store.set('week',week); render(); return; }
  if(t.dataset.open){ const c=document.getElementById(t.dataset.open); const o=c.classList.toggle('open'); t.setAttribute('aria-expanded',o); t.textContent=o?'Fechar':'Como fazer'; return; }
  if(t.dataset.done){ const id=t.dataset.done, e=findEx(id), n=setsFor(e,week); let got;
    save(id,l=>{ const cur=Math.min(n,l.n||(l.done?n:0)); l.n = cur>=n ? 0 : n; l.done = l.n>=n; got=l.n; });
    const c=document.getElementById(id); c.querySelectorAll('.disc').forEach((d,j)=>d.classList.toggle('on',j<got));
    c.classList.toggle('done',got>=n); c.querySelector('.sethint').textContent = got>=n?'Exercício concluído':'Toque na anilha ao terminar cada série. O descanso começa sozinho.';
    t.textContent = got>=n ? 'Concluído ✓' : 'Marcar como concluído'; updateProg(); renderTabs();
    if(got>=n){ stopTimer(); const nx=c.nextElementSibling; if(nx&&nx.classList.contains('ex')) setTimeout(()=>nx.scrollIntoView({behavior:'smooth',block:'start'}),350); }
    return; }
  if(t.dataset.rest){ startTimer(+t.dataset.rest, t.dataset.name); return; }
  if(t.id==='tStop'){ stopTimer(); return; }
  if(t.id==='reset'){ if(confirm('Apagar todos os registros de carga e treinos feitos?')){ try{ Object.keys(localStorage).filter(k=>k.startsWith('tw:')).forEach(k=>localStorage.removeItem(k)) }catch(e){} week=1; render(); } }
});
document.addEventListener('input',ev=>{
  const i=ev.target;
  if(i.dataset.kg){ save(i.dataset.kg,l=>{ l.kg=i.value.replace(',','.'); }); }
  if(i.dataset.f){ save(i.dataset.id,l=>{ const s=+i.dataset.s; l.sets[s]=l.sets[s]||{}; l.sets[s][i.dataset.f]=i.value.replace(',','.'); }); }
});
document.addEventListener('change',ev=>{
  const i=ev.target;
  if(i.dataset.rir){ save(i.dataset.rir,l=>{l.rir=i.value}); }
  if(i.id==='cardio') store.set('cardio:'+week+':'+day, i.checked);
  if(i.id==='walk'){ store.set('walk:'+week, i.checked); renderTabs(); }
});

let tInt=null, tEnd=0;
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0') }
function startTimer(sec,name){
  stopTimer(); tEnd=Date.now()+sec*1000;
  const el=$('#timer'); el.classList.add('on'); el.classList.remove('end');
  $('#tLbl').textContent='Descanso'; $('#tStop').textContent='Pular';
  const tick=()=>{ const left=Math.max(0,Math.round((tEnd-Date.now())/1000)); $('#tTime').textContent=fmt(left);
    if(left<=0){ clearInterval(tInt); tInt=null; el.classList.add('end'); $('#tLbl').textContent='Bora, próxima série'; $('#tStop').textContent='Fechar'; try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){} } };
  tick(); tInt=setInterval(tick,500);
}
function stopTimer(){ if(tInt) clearInterval(tInt); tInt=null; $('#timer').classList.remove('on','end'); }

const VIEW={side:'Vista lateral',front:'Vista de frente',top:'Vista de cima'};

const playing=new Map(), animPref={}, speed={};
function findEx(id){ for(const d of DAYS){ const e=d.ex.find(x=>x.id===id); if(e) return e; } }
const ytId = u => { const m=String(u||'').match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([\w-]{11})/); return m?m[1]:null; };
const VIDEOS = {"s1": "8rtiqrfs9yI", "s2": "BOW9my4J_ek", "s3": "qmSOsrheLEg", "s4": "2YebbYuuBJQ", "s5": "vpHr5eIvEUE", "s6": "gURBTU9VSJg", "s7": "YQ6MRBeyIAE", "t1": "4vA727LveHQ", "t2": "EAibOhu4lAI", "t3": "pJZXbaF-MCM", "t4": "8Nat6GRiEoc", "t5": "goQVyEGMYMM", "t6": "F7_8z_7Kwks", "t7": "iqIDyRbXAMc", "q1": "093htCVTlOE", "q2": "Q7K6DI9R-A8", "q3": "VoGNKTI5wG8", "q4": "HdI6iAqZC1I", "q5": "gURBTU9VSJg", "q6": "DiBL11daWPc", "q7": "KH_bjsWEVI8", "u1": "601YoPL6y6E", "u2": "_TDeIBSoKzk", "u3": "dWTiU23iVgg", "u4": "50qHGus1TZk", "u5": "pJZXbaF-MCM", "u6": "1x2QAgstSn4", "u7": "hfFVbXJ5UvQ", "x1": "ze9B6VX4nUs", "x2": "uA3IrbUAVKA", "x3": "vpHr5eIvEUE", "x4": "lkEoFfNyzkk", "x5": "FNsI7x7YtZU", "x6": "LA5-0_DCd1w", "x7": "5vPGH1uTtbs", "x8": "DiBL11daWPc", "x9": "iqIDyRbXAMc"};
function buildPlayer(id,msg){
  const e=findEx(id), el=document.getElementById('pl-'+id); if(!e||!el) return;
  const own=store.get('yt:'+id), yt=own||VIDEOS[id];
  playing.delete(id);
  let bar = `<a class="ytl" href="https://www.youtube.com/watch?v=${yt}" target="_blank" rel="noopener">Abrir no YouTube</a>`;
  bar += `<button data-yt="${id}">Trocar vídeo</button>`;
  if(own) bar += `<button data-ytdel="${id}">Voltar ao vídeo padrão</button>`;
  el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${yt}?rel=0&playsinline=1" title="Vídeo: ${e.n}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
    + `<div class="pbar">${bar}</div>${msg?`<div class="pmsg">${msg}</div>`:''}<div class="pcue">${e.t}</div>`;
}
function loop(now){
  playing.forEach((p,id)=>{ if(!p.svg.isConnected){ playing.delete(id); return; }
    p.acc += (now-p.last)*(speed[id]?0.45:1); p.last=now; p.svg.innerHTML=ANIM.frame(MOVE[id],ANIM.phaseT(p.acc)); });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function refreshOpen(){ document.querySelectorAll('.ex.play').forEach(c=>buildPlayer(c.id)); }

render();
</script>
